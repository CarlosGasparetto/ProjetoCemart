<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEMART - Consultar Posição</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Dependências Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <!-- Configurações PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#312e81">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <header class="bg-indigo-900 text-white shadow-md">
    <div class="max-w-xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="index.html" class="text-indigo-200 hover:text-white text-xs flex items-center gap-1.5 transition">
        <i class="fa-solid fa-chevron-left"></i> Início
      </a>
      <h1 class="font-bold text-sm">Consulta de Fila • CEMART</h1>
      <span class="w-10"></span>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 py-8 flex-1 w-full space-y-5">
    <div class="bg-white rounded-2xl shadow-xs border border-slate-200 p-6">
      <h2 class="text-lg font-bold text-slate-900 mb-1">Verificar Situação na Fila</h2>
      <p class="text-xs text-slate-500 mb-4">Informe o número de protocolo ou o nome completo do aluno</p>

      <form id="formBusca" onsubmit="buscarFila(event)" class="flex gap-2">
        <input 
          type="text" 
          id="buscaDoc" 
          required
          placeholder="Ex: CEM-2026-1234 ou Nome do aluno" 
          class="flex-1 px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs uppercase focus:ring-2 focus:ring-indigo-600 focus:bg-white focus:outline-none transition"
        >
        <button 
          type="submit" 
          id="btnBuscar"
          class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-semibold rounded-xl text-xs transition flex items-center gap-1.5 shadow-xs"
        >
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>Consultar</span>
        </button>
      </form>
    </div>

    <!-- Área com Lista de Resultados -->
    <div id="resultadoBusca" class="hidden space-y-4"></div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
    Centro Municipal de Artes de Barretos (CEMART) • Consulta Pública
  </footer>

  <script>
    async function buscarFila(e) {
      e.preventDefault();
      
      const termo = document.getElementById('buscaDoc').value.trim().toUpperCase();
      const resultadoDiv = document.getElementById('resultadoBusca');
      const btn = document.getElementById('btnBuscar');

      if (!termo) return;

      resultadoDiv.classList.remove('hidden');
      resultadoDiv.innerHTML = `
        <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs text-center text-xs text-slate-400">
          <i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Consultando registros do CEMART...
        </div>
      `;
      btn.disabled = true;

      try {
        const { data: resultados, error } = await db
          .from('fila_cemart')
          .select('*')
          .or(`protocolo.eq.${termo},nome_aluno.ilike.%${termo}%`);

        if (error) throw error;

        if (!resultados || resultados.length === 0) {
          resultadoDiv.innerHTML = `
            <div class="bg-amber-50 border border-amber-200 rounded-2xl p-5 text-center text-xs text-amber-800">
              <i class="fa-solid fa-triangle-exclamation text-amber-600 text-lg mb-1 block"></i>
              Nenhum registro encontrado para <strong>"${termo}"</strong>. Confira o protocolo ou nome cadastrado.
            </div>
          `;
          return;
        }

        resultadoDiv.innerHTML = '';

        // Itera por todos os cursos em que o aluno se inscreveu
        for (const item of resultados) {
          let posicaoTexto = '—';
          if (item.status === 'Aguardando') {
            const { count } = await db
              .from('fila_cemart')
              .select('*', { count: 'exact', head: true })
              .eq('curso', item.curso)
              .eq('periodo', item.periodo)
              .eq('status', 'Aguardando')
              .lte('criado_em', item.criado_em);

            if (count !== null) posicaoTexto = `${count}º lugar`;
          }

          let statusBadgeClass = 'bg-amber-100 text-amber-800 border-amber-200';
          if (item.status === 'Convocado') statusBadgeClass = 'bg-indigo-100 text-indigo-800 border-indigo-200';
          else if (item.status === 'Matriculado') statusBadgeClass = 'bg-emerald-100 text-emerald-800 border-emerald-200';
          else if (item.status.includes('Desistente')) statusBadgeClass = 'bg-rose-100 text-rose-800 border-rose-200';

          const card = document.createElement('div');
          card.className = 'bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden';
          card.innerHTML = `
            <div class="bg-slate-50 px-5 py-3.5 border-b border-slate-100 flex justify-between items-center">
              <div>
                <span class="text-[10px] uppercase font-bold text-slate-400 block tracking-wider">Protocolo</span>
                <span class="text-xs font-mono font-bold text-slate-800">${item.protocolo}</span>
              </div>
              <span class="px-2.5 py-1 rounded-full text-[11px] font-bold border ${statusBadgeClass}">
                ${item.status}
              </span>
            </div>

            <div class="p-5 space-y-2.5 text-xs">
              <div class="flex justify-between py-1.5 border-b border-slate-100">
                <span class="text-slate-500">Aluno</span>
                <span class="font-bold text-slate-900">${item.nome_aluno}</span>
              </div>

              ${item.nome_responsavel ? `
                <div class="flex justify-between py-1.5 border-b border-slate-100">
                  <span class="text-slate-500">Responsável</span>
                  <span class="font-medium text-slate-700">${item.nome_responsavel}</span>
                </div>
              ` : ''}

              <div class="flex justify-between py-1.5 border-b border-slate-100">
                <span class="text-slate-500">Curso / Nível</span>
                <span class="font-medium text-slate-800">${item.curso} • <strong>${item.nivel || 'Iniciante'}</strong></span>
              </div>

              <div class="flex justify-between py-1.5 border-b border-slate-100">
                <span class="text-slate-500">Turno</span>
                <span class="font-medium text-slate-800">${item.periodo}</span>
              </div>

              <div class="flex justify-between py-1.5 border-b border-slate-100 items-center">
                <span class="text-slate-500">Classificação na Lista</span>
                <span class="font-extrabold text-indigo-700 text-sm">${posicaoTexto}</span>
              </div>

              ${item.status === 'Convocado' ? `
                <div class="mt-4 p-3.5 bg-indigo-50 border border-indigo-200 rounded-xl text-indigo-950 text-[11px] leading-relaxed">
                  <strong class="font-bold block mb-0.5 text-indigo-900"><i class="fa-solid fa-bullhorn mr-1"></i> Vaga Convocada!</strong>
                  Compareça à secretaria do CEMART com RG, CPF e Comprovante de Residência para efetivar a matrícula.
                </div>
              ` : ''}
            </div>
          `;
          resultadoDiv.appendChild(card);
        }

      } catch (err) {
        resultadoDiv.innerHTML = `
          <div class="bg-rose-50 border border-rose-200 rounded-2xl p-4 text-center text-xs text-rose-800">
            Erro ao processar a consulta: ${err.message || 'Verifique a conexão.'}
          </div>
        `;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
