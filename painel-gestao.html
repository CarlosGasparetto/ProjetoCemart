<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEMART - Painel de Gestão</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Topbar -->
  <header class="bg-slate-900 text-white px-6 py-3.5 flex items-center justify-between border-b border-slate-800">
    <div class="flex items-center gap-3">
      <span class="bg-indigo-600 px-2 py-1 rounded text-xs font-bold text-amber-400">CEMART</span>
      <h1 class="text-sm font-bold">Gestão da Lista de Espera • Secretaria</h1>
    </div>
    <a href="inscricao.html" target="_blank" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg flex items-center gap-1.5 transition">
      <i class="fa-solid fa-plus"></i> Digitar Nova Ficha
    </a>
  </header>

  <main class="p-6 flex-1 max-w-7xl mx-auto w-full space-y-5">
    
    <!-- Filtros de Tabela -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex flex-wrap gap-3 items-center justify-between">
      <div class="flex flex-wrap gap-2 text-xs">
        <select id="filtroCurso" onchange="renderizarTabela()" class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 font-medium">
          <option value="">Todos os Cursos</option>
          <option value="Violão Clássico">Violão Clássico</option>
          <option value="Teatro">Teatro</option>
          <option value="Dança Contemporânea">Dança Contemporânea</option>
          <option value="Artes Visuais">Artes Visuais</option>
          <option value="Teclado / Piano">Teclado / Piano</option>
        </select>

        <select id="filtroPeriodo" onchange="renderizarTabela()" class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 font-medium">
          <option value="">Todos os Períodos</option>
          <option value="Matutino">Matutino</option>
          <option value="Vespertino">Vespertino</option>
          <option value="Noturno">Noturno</option>
        </select>
      </div>

      <div class="text-xs text-slate-500 font-medium">
        Total cadastrado: <span id="contadorTotal" class="font-bold text-slate-800">0</span>
      </div>
    </div>

    <!-- Tabela da Fila -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-50 text-slate-500 uppercase text-[10px] tracking-wider border-b border-slate-200">
            <tr>
              <th class="py-3 px-4 text-center">Pos.</th>
              <th class="py-3 px-4">Protocolo / Data</th>
              <th class="py-3 px-4">Candidato / WhatsApp</th>
              <th class="py-3 px-4">Curso / Turno</th>
              <th class="py-3 px-4">Status</th>
              <th class="py-3 px-4 text-right">Ações do Servidor</th>
            </tr>
          </thead>
          <tbody id="corpoTabela" class="divide-y divide-slate-100 text-slate-700">
            <!-- Renderizado via JavaScript -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    function carregarDados() {
      let dados = JSON.parse(localStorage.getItem('cemart_fila') || '[]');
      if (dados.length === 0) {
        // Dados de teste para demonstração inicial
        dados = [
          { protocolo: 'CEM-2026-0001', nome: 'Mariana Santos', cpf: '111.222.333-44', fone1: '17998765432', curso: 'Violão Clássico', periodo: 'Vespertino', status: 'Aguardando', dataHora: '2026-03-01T10:00:00Z' },
          { protocolo: 'CEM-2026-0002', nome: 'Lucas Oliveira', cpf: '222.333.444-55', fone1: '17981112233', curso: 'Violão Clássico', periodo: 'Vespertino', status: 'Aguardando', dataHora: '2026-03-01T11:15:00Z' }
        ];
        localStorage.setItem('cemart_fila', JSON.stringify(dados));
      }
      return dados;
    }

    function renderizarTabela() {
      const lista = carregarDados();
      const curso = document.getElementById('filtroCurso').value;
      const periodo = document.getElementById('filtroPeriodo').value;
      const tbody = document.getElementById('corpoTabela');

      tbody.innerHTML = '';

      let filtrados = lista.filter(item => {
        return (curso === '' || item.curso === curso) && (periodo === '' || item.periodo === periodo);
      });

      document.getElementById('contadorTotal').innerText = filtrados.length;

      filtrados.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition';
        
        const msgWhats = encodeURIComponent(`Olá ${item.nome}, informamos que surgiu uma vaga para o curso de ${item.curso} (${item.periodo}) no CEMART. Favor comparecer para efetivar sua matrícula.`);
        const foneLimpo = item.fone1.replace(/\D/g, '');

        tr.innerHTML = `
          <td class="py-3 px-4 text-center font-bold text-slate-600">${index + 1}º</td>
          <td class="py-3 px-4">
            <span class="font-bold text-slate-800">${item.protocolo}</span>
            <span class="block text-[10px] text-slate-400">${new Date(item.dataHora).toLocaleDateString('pt-BR')}</span>
          </td>
          <td class="py-3 px-4">
            <p class="font-semibold text-slate-800">${item.nome}</p>
            <div class="flex items-center gap-1.5 text-slate-500">
              <span>${item.fone1}</span>
              <a href="https://wa.me/55${foneLimpo}?text=${msgWhats}" target="_blank" class="text-emerald-600 hover:text-emerald-700" title="Chamar WhatsApp">
                <i class="fa-brands fa-whatsapp text-sm"></i>
              </a>
            </div>
          </td>
          <td class="py-3 px-4 font-medium">${item.curso} <span class="text-slate-400">(${item.periodo})</span></td>
          <td class="py-3 px-4">
            <select onchange="atualizarStatus('${item.protocolo}', this.value)" class="text-[11px] font-semibold rounded-lg px-2 py-1 border border-slate-200 ${item.status === 'Convocado' ? 'bg-indigo-50 text-indigo-700' : item.status === 'Matriculado' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}">
              <option value="Aguardando" ${item.status === 'Aguardando' ? 'selected' : ''}>Aguardando</option>
              <option value="Convocado" ${item.status === 'Convocado' ? 'selected' : ''}>Convocado</option>
              <option value="Matriculado" ${item.status === 'Matriculado' ? 'selected' : ''}>Matriculado</option>
              <option value="Desistente / Cancelado" ${item.status === 'Desistente / Cancelado' ? 'selected' : ''}>Desistente</option>
            </select>
          </td>
          <td class="py-3 px-4 text-right">
            <a href="https://wa.me/55${foneLimpo}?text=${msgWhats}" target="_blank" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-[11px] font-semibold inline-flex items-center gap-1">
              <i class="fa-solid fa-bullhorn text-[10px]"></i> Notificar
            </a>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function atualizarStatus(protocolo, novoStatus) {
      let lista = JSON.parse(localStorage.getItem('cemart_fila') || '[]');
      const index = lista.findIndex(i => i.protocolo === protocolo);
      if (index !== -1) {
        lista[index].status = novoStatus;
        localStorage.setItem('cemart_fila', JSON.stringify(lista));
        renderizarTabela();
      }
    }

    document.addEventListener('DOMContentLoaded', renderizarTabela);
  </script>
</body>
</html>
