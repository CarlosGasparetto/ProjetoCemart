<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da Secretaria - CEMART</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Dependências Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <!-- Proteção imediata de sessão -->
  <script>
    if (sessionStorage.getItem('autenticado_cemart') !== 'true') {
      window.location.href = 'index.html';
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Topo Administrativo -->
  <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-700 p-2 rounded-xl text-amber-400">
          <i class="fa-solid fa-chalkboard-user text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg leading-tight">CEMART - Painel da Secretaria</h1>
          <p class="text-xs text-indigo-200">Gestão de Vagas e Chamadas</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="abrirModalSenha()" class="px-3 py-1.5 bg-indigo-800 hover:bg-indigo-700 rounded-xl text-xs font-semibold transition border border-indigo-700 flex items-center gap-1.5">
          <i class="fa-solid fa-key text-[10px]"></i> Alterar Senha
        </button>
        <button onclick="fazerLogout()" class="px-3 py-1.5 bg-rose-600/90 hover:bg-rose-600 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
          <i class="fa-solid fa-right-from-bracket text-[10px]"></i> Sair
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-6 flex-1 w-full space-y-6">

    <!-- Indicadores Rápidos -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
        <span class="text-xs text-slate-500 font-medium">Total de Registros</span>
        <p id="totalRegistros" class="text-2xl font-black text-slate-900 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
        <span class="text-xs text-amber-600 font-medium">Na Fila (Aguardando)</span>
        <p id="totalAguardando" class="text-2xl font-black text-amber-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
        <span class="text-xs text-blue-600 font-medium">Convocados</span>
        <p id="totalConvocados" class="text-2xl font-black text-blue-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
        <span class="text-xs text-emerald-600 font-medium">Matriculados</span>
        <p id="totalMatriculados" class="text-2xl font-black text-emerald-600 mt-1">0</p>
      </div>
    </div>

    <!-- Barra de Filtros e Ações -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-2.5 flex-1 min-w-[280px]">
        <div class="relative flex-1 min-w-[180px]">
          <input 
            type="text" 
            id="buscaTexto" 
            oninput="filtrarTabela()" 
            placeholder="Buscar por nome, CPF ou protocolo..." 
            class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none"
          >
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
        </div>

        <select id="filtroCurso" onchange="filtrarTabela()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none">
          <option value="">Todos os Cursos</option>
        </select>

        <select id="filtroStatus" onchange="filtrarTabela()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none">
          <option value="">Todos os Status</option>
          <option value="Aguardando">Aguardando</option>
          <option value="Convocado">Convocado</option>
          <option value="Matriculado">Matriculado</option>
          <option value="Desistente">Desistente</option>
        </select>
      </div>

      <button onclick="carregarDadosFila()" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs transition flex items-center gap-1.5">
        <i class="fa-solid fa-rotate"></i> Atualizar
      </button>
    </div>

    <!-- Tabela da Fila -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-600">
          <thead class="bg-slate-50 text-slate-700 uppercase font-bold text-[10px] tracking-wider border-b border-slate-200">
            <tr>
              <th class="px-4 py-3 text-center">Pos.</th>
              <th class="px-4 py-3">Candidato / Protocolo</th>
              <th class="px-4 py-3">Curso / Período</th>
              <th class="px-4 py-3">Inscrição</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3 text-right">Ações da Secretaria</th>
            </tr>
          </thead>
          <tbody id="tabelaCorpo" class="divide-y divide-slate-100">
            <tr>
              <td colspan="6" class="px-4 py-8 text-center text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-lg mb-2"></i>
                <p>Carregando registros da fila...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal de Alteração de Senha via RPC Seguro -->
  <div id="modalSenha" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-xs w-full p-6 shadow-xl border border-slate-200 space-y-4">
      <h3 class="text-sm font-bold text-slate-800">Alterar Senha de Gestão</h3>
      <form onsubmit="processarTrocaSenha(event)" class="space-y-3">
        <div>
          <label class="block text-[11px] font-semibold text-slate-600 mb-1">Senha Atual</label>
          <input type="password" id="senhaAtualInput" required class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none">
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-slate-600 mb-1">Nova Senha</label>
          <input type="password" id="senhaNovaInput" required minlength="4" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="fecharModalSenha()" class="px-3 py-2 text-slate-500 hover:text-slate-700 text-xs font-semibold">Cancelar</button>
          <button type="submit" id="btnSalvarSenha" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold shadow-xs">Salvar Senha</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let registrosGlobais = [];

    document.addEventListener('DOMContentLoaded', () => {
      carregarCursosFiltro();
      carregarDadosFila();
    });

    async function carregarCursosFiltro() {
      try {
        const { data: cursos } = await db.from('cursos').select('nome_curso').eq('ativo', true).order('nome_curso');
        const select = document.getElementById('filtroCurso');
        if (cursos) {
          cursos.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.nome_curso;
            opt.textContent = c.nome_curso;
            select.appendChild(opt);
          });
        }
      } catch (e) {
        console.error('Erro ao carregar cursos:', e);
      }
    }

    async function carregarDadosFila() {
      const corpo = document.getElementById('tabelaCorpo');
      corpo.innerHTML = `<tr><td colspan="6" class="px-4 py-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin text-lg mb-2"></i><p>Atualizando lista...</p></td></tr>`;

      try {
        const { data, error } = await db
          .from('fila_cemart')
          .select('*')
          .order('criado_em', { ascending: true });

        if (error) throw error;
        registrosGlobais = data || [];
        renderizarTabela(registrosGlobais);
        atualizarCards(registrosGlobais);
      } catch (err) {
        corpo.innerHTML = `<tr><td colspan="6" class="px-4 py-8 text-center text-rose-500">Erro ao carregar os dados.</td></tr>`;
      }
    }

    function renderizarTabela(lista) {
      const corpo = document.getElementById('tabelaCorpo');
      corpo.innerHTML = '';

      if (lista.length === 0) {
        corpo.innerHTML = `<tr><td colspan="6" class="px-4 py-8 text-center text-slate-400">Nenhum registro encontrado.</td></tr>`;
        return;
      }

      // Calcula a colocação na fila por curso/período apenas para status 'Aguardando'
      const contadores = {};

      lista.forEach(reg => {
        let posicaoTexto = '-';
        if (reg.status === 'Aguardando') {
          const chave = `${reg.curso}_${reg.periodo}`;
          contadores[chave] = (contadores[chave] || 0) + 1;
          posicaoTexto = `${contadores[chave]}º`;
        }

        const dataFormatada = new Date(reg.criado_em).toLocaleDateString('pt-BR', {
          day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        let statusClass = 'bg-amber-100 text-amber-800 border-amber-200';
        if (reg.status === 'Convocado') statusClass = 'bg-blue-100 text-blue-800 border-blue-200';
        if (reg.status === 'Matriculado') statusClass = 'bg-emerald-100 text-emerald-800 border-emerald-200';
        if (reg.status === 'Desistente') statusClass = 'bg-rose-100 text-rose-800 border-rose-200';

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition';
        tr.innerHTML = `
          <td class="px-4 py-3 font-bold text-center text-indigo-700">${posicaoTexto}</td>
          <td class="px-4 py-3">
            <p class="font-bold text-slate-800">${reg.nome_completo}</p>
            <p class="text-[11px] text-slate-400">CPF: ${reg.cpf} • Prot: <span class="font-mono text-indigo-600">${reg.protocolo || '-'}</span></p>
          </td>
          <td class="px-4 py-3">
            <span class="font-medium text-slate-700">${reg.curso}</span>
            <p class="text-[11px] text-slate-400">${reg.periodo || 'Não informado'}</p>
          </td>
          <td class="px-4 py-3 text-[11px] text-slate-500">${dataFormatada}</td>
          <td class="px-4 py-3">
            <span class="px-2 py-0.5 rounded-md text-[10px] font-bold border ${statusClass}">${reg.status}</span>
          </td>
          <td class="px-4 py-3 text-right">
            <div class="inline-flex items-center gap-1.5">
              ${reg.telefone ? `
                <a href="https://wa.me/55${reg.telefone.replace(/\D/g, '')}?text=Olá%20${encodeURIComponent(reg.nome_completo)},%20aqui%20é%20da%20secretaria%20do%20CEMART." target="_blank" class="p-1.5 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 rounded-lg transition" title="Chamar no WhatsApp">
                  <i class="fa-brands fa-whatsapp text-sm"></i>
                </a>
              ` : ''}
              <select onchange="atualizarStatus(${reg.id}, this.value)" class="text-[11px] px-2 py-1 bg-slate-100 border border-slate-200 rounded-lg focus:outline-none">
                <option value="Aguardando" ${reg.status === 'Aguardando' ? 'selected' : ''}>Aguardando</option>
                <option value="Convocado" ${reg.status === 'Convocado' ? 'selected' : ''}>Convocado</option>
                <option value="Matriculado" ${reg.status === 'Matriculado' ? 'selected' : ''}>Matriculado</option>
                <option value="Desistente" ${reg.status === 'Desistente' ? 'selected' : ''}>Desistente</option>
              </select>
            </div>
          </td>
        `;
        corpo.appendChild(tr);
      });
    }

    function atualizarCards(lista) {
      document.getElementById('totalRegistros').innerText = lista.length;
      document.getElementById('totalAguardando').innerText = lista.filter(r => r.status === 'Aguardando').length;
      document.getElementById('totalConvocados').innerText = lista.filter(r => r.status === 'Convocado').length;
      document.getElementById('totalMatriculados').innerText = lista.filter(r => r.status === 'Matriculado').length;
    }

    function filtrarTabela() {
      const texto = document.getElementById('buscaTexto').value.toLowerCase();
      const curso = document.getElementById('filtroCurso').value;
      const status = document.getElementById('filtroStatus').value;

      const filtrados = registrosGlobais.filter(r => {
        const bateTexto = (r.nome_completo || '').toLowerCase().includes(texto) ||
                          (r.cpf || '').includes(texto) ||
                          (r.protocolo || '').toLowerCase().includes(texto);
        const bateCurso = curso === '' || r.curso === curso;
        const bateStatus = status === '' || r.status === status;
        return bateTexto && bateCurso && bateStatus;
      });

      renderizarTabela(filtrados);
    }

    async function atualizarStatus(id, novoStatus) {
      try {
        const { error } = await db
          .from('fila_cemart')
          .update({ status: novoStatus })
          .eq('id', id);

        if (error) throw error;
        const item = registrosGlobais.find(r => r.id === id);
        if (item) item.status = novoStatus;
        atualizarCards(registrosGlobais);
      } catch (err) {
        alert('Erro ao atualizar status.');
        carregarDadosFila();
      }
    }

    // --- Modal de Troca de Senha com RPC Seguro ---
    function abrirModalSenha() {
      document.getElementById('senhaAtualInput').value = '';
      document.getElementById('senhaNovaInput').value = '';
      document.getElementById('modalSenha').classList.remove('hidden');
      document.getElementById('modalSenha').classList.add('flex');
    }

    function fecharModalSenha() {
      document.getElementById('modalSenha').classList.add('hidden');
      document.getElementById('modalSenha').classList.remove('flex');
    }

    async function processarTrocaSenha(e) {
      e.preventDefault();
      const senhaAtual = document.getElementById('senhaAtualInput').value;
      const senhaNova = document.getElementById('senhaNovaInput').value;
      const btn = document.getElementById('btnSalvarSenha');

      btn.disabled = true;
      btn.innerText = 'Salvando...';

      try {
        // Chamada à função RPC que valida a senha atual no banco e grava a nova
        const { data: sucesso, error } = await db.rpc('atualizar_senha_gestao', {
          senha_antiga: senhaAtual,
          senha_nova: senhaNova
        });

        if (error) throw error;

        if (sucesso === true) {
          alert('Senha institucional atualizada com sucesso!');
          fecharModalSenha();
        } else {
          alert('A senha atual digitada está incorreta.');
        }
      } catch (err) {
        alert('Erro de comunicação ao atualizar senha.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Salvar Senha';
      }
    }

    function fazerLogout() {
      sessionStorage.removeItem('autenticado_cemart');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
