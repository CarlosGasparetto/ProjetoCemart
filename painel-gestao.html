<!-- ================= SCRIPTS ================= -->
  <script>
    let registrosGlobais = [];
    let cursosBanco = [];

    // Proteção XSS
    function escapeHTML(str) {
      if (!str) return '';
      return str.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function formatarTelefoneExibicao(tel) {
      if (!tel) return '';
      const d = tel.toString().replace(/\D/g, '');
      if (d.length === 11) return d.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
      if (d.length === 10) return d.replace(/^(\d{2})(\d{4})(\d{4})$/, '($1) $2-$3');
      return tel;
    }

    // Inicialização com detetor de erros visuais
    document.addEventListener('DOMContentLoaded', async () => {
      const corpo = document.getElementById('tabelaCorpo');
      try {
        if (typeof db === 'undefined') {
          throw new Error('A conexão com o Supabase (db) não foi encontrada. Verifique o ficheiro supabase-client.js.');
        }
        
        corpo.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-slate-500"><i class="fa-solid fa-spinner fa-spin text-lg mb-2"></i><p>1/2 - Conectando ao catálogo de cursos...</p></td></tr>';
        await carregarCursosFiltro();
        
        corpo.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-slate-500"><i class="fa-solid fa-spinner fa-spin text-lg mb-2"></i><p>2/2 - Lendo a fila de espera...</p></td></tr>';
        await carregarDadosFila();
        
      } catch (err) {
        corpo.innerHTML = `<tr><td colspan="6" class="px-4 py-8 text-center text-rose-600 font-bold bg-rose-50 rounded-xl"><i class="fa-solid fa-triangle-exclamation text-xl mb-2"></i><br>Erro Crítico detectado:<br>${err.message}</td></tr>`;
        console.error(err);
      }
    });

    /* --- GESTÃO DE ACESSOS --- */
    async function abrirModalAcessos() {
      document.getElementById('modalAcessos').classList.remove('hidden');
      document.getElementById('modalAcessos').classList.add('flex');
      await listarAcessos();
    }

    function fecharModalAcessos() {
      document.getElementById('modalAcessos').classList.add('hidden');
      document.getElementById('modalAcessos').classList.remove('flex');
    }

    async function listarAcessos() {
      const listaEl = document.getElementById('listaAcessosModal');
      listaEl.innerHTML = '<p class="text-center py-4 text-xs text-slate-400"><i class="fa-solid fa-spinner fa-spin"></i> Carregando usuários...</p>';
      try {
        const { data: usuarios, error } = await db.from('usuarios_permitidos').select('*').order('criado_em', { ascending: true });
        if (error) throw error;
        listaEl.innerHTML = '';
        if (!usuarios || usuarios.length === 0) {
          listaEl.innerHTML = '<p class="text-center py-4 text-xs text-slate-400">Nenhum e-mail autorizado ainda.</p>';
          return;
        }
        usuarios.forEach(u => {
          const div = document.createElement('div');
          div.className = 'py-3 flex items-center justify-between gap-3 px-2 hover:bg-slate-50 rounded-lg transition';
          div.innerHTML = `
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs"><i class="fa-solid fa-user"></i></div>
              <div><span class="text-xs font-bold text-slate-800">${escapeHTML(u.email)}</span></div>
            </div>
            <button onclick="removerAcesso(${u.id}, '${encodeURIComponent(u.email)}')" class="px-2.5 py-1.5 bg-white border border-slate-200 text-slate-400 hover:bg-rose-50 hover:text-rose-600 hover:border-rose-200 rounded-lg transition cursor-pointer" title="Remover acesso"><i class="fa-solid fa-trash-can text-xs"></i></button>
          `;
          listaEl.appendChild(div);
        });
      } catch (e) {
        listaEl.innerHTML = '<p class="text-center py-4 text-xs text-rose-500">Erro ao carregar lista.</p>';
      }
    }

    async function adicionarAcesso(e) {
      e.preventDefault();
      const emailInput = document.getElementById('novoEmailInput');
      const email = emailInput.value.trim().toLowerCase();
      if (!email) return;
      const btn = document.getElementById('btnAdicionarAcesso');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
      try {
        const { error } = await db.from('usuarios_permitidos').insert([{ email: email }]);
        if (error) throw error;
        emailInput.value = '';
        await listarAcessos();
      } catch (err) { alert('Erro ao autorizar e-mail. Ele já pode estar na lista.'); } 
      finally { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-plus mr-1.5"></i> Autorizar'; }
    }

    async function removerAcesso(id, emailCod) {
      const email = decodeURIComponent(emailCod);
      if (!confirm(`Revogar o acesso de ${email}?`)) return;
      try {
        const { error } = await db.from('usuarios_permitidos').delete().eq('id', id);
        if (error) throw error;
        await listarAcessos();
      } catch (err) { alert('Erro ao remover o acesso.'); }
    }

    /* --- GESTÃO DE CURSOS E FILA --- */
    async function carregarCursosFiltro() {
      const { data: cursos, error } = await db.from('cursos').select('*').order('nome_curso');
      if (!error && cursos) { cursosBanco = cursos; atualizarFiltroCursos(); }
    }

    function atualizarFiltroCursos() {
      const nucleoSel = document.getElementById('filtroNucleo').value;
      const select = document.getElementById('filtroCurso');
      const valorAnterior = select.value;
      select.innerHTML = '<option value="">Todos os Cursos</option>';
      const filtrados = nucleoSel ? cursosBanco.filter(c => c.nucleo === nucleoSel) : cursosBanco;
      filtrados.forEach(c => {
        if (c.ativo !== false) {
          const opt = document.createElement('option');
          opt.value = c.nome_curso; opt.textContent = c.nome_curso;
          select.appendChild(opt);
        }
      });
      if (valorAnterior && Array.from(select.options).some(o => o.value === valorAnterior)) {
        select.value = valorAnterior;
      }
    }

    async function carregarDadosFila() {
      const corpo = document.getElementById('tabelaCorpo');
      const { data, error } = await db.from('fila_cemart').select('*').order('criado_em', { ascending: true });
      if (error) throw error;
      registrosGlobais = data || [];
      atualizarCards(registrosGlobais);
      filtrarTabela();
    }

    function renderizarTabela(lista) {
      const corpo = document.getElementById('tabelaCorpo');
      corpo.innerHTML = '';
      if (!lista || lista.length === 0) {
        corpo.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-slate-400">Nenhum registro encontrado.</td></tr>';
        return;
      }
      const contadores = {};
      lista.forEach(reg => {
        let posicaoTexto = '-';
        if (reg.status === 'Aguardando') {
          const chave = reg.curso + '_' + reg.periodo;
          contadores[chave] = (contadores[chave] || 0) + 1;
          posicaoTexto = contadores[chave] + 'º';
        }
        const dataFormatada = reg.criado_em ? new Date(reg.criado_em).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
        const fonePrincipal = reg.fone1 ? reg.fone1.toString().replace(/\D/g, '') : '';
        const foneSecundario = reg.fone2 ? reg.fone2.toString().replace(/\D/g, '') : '';
        let textoContatos = (fonePrincipal ? formatarTelefoneExibicao(fonePrincipal) : '');
        textoContatos += (foneSecundario ? (textoContatos ? ' / ' : '') + formatarTelefoneExibicao(foneSecundario) : '');
        if (!textoContatos) textoContatos = 'Sem telefone';
        
        const cursoInfo = cursosBanco.find(c => c.nome_curso === reg.curso);
        const nucleoTag = cursoInfo && cursoInfo.nucleo ? '<span class="text-[10px] font-semibold text-indigo-700 bg-indigo-50 px-1.5 py-0.5 rounded mr-1">' + escapeHTML(cursoInfo.nucleo) + '</span>' : '';
        
        let statusClass = 'bg-amber-100 text-amber-800 border-amber-200';
        if (reg.status === 'Convocado') statusClass = 'bg-blue-100 text-blue-800 border-blue-200';
        if (reg.status === 'Matriculado') statusClass = 'bg-emerald-100 text-emerald-800 border-emerald-200';
        if (reg.status === 'Desistente') statusClass = 'bg-rose-100 text-rose-800 border-rose-200';

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition';
        let btnConvocar = '';
        if (reg.status === 'Aguardando' && (fonePrincipal || foneSecundario)) {
          btnConvocar = '<button onclick="convocarWhatsApp(' + reg.id + ', \'' + encodeURIComponent(reg.nome_aluno || '') + '\', \'' + (fonePrincipal || foneSecundario) + '\', \'' + encodeURIComponent(reg.curso || '') + '\', \'' + encodeURIComponent(reg.periodo || '') + '\', \'' + encodeURIComponent(reg.protocolo || '') + '\')" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-[11px] font-bold transition shadow-xs flex items-center gap-1.5 cursor-pointer"><i class="fa-brands fa-whatsapp text-xs"></i> Convocar</button>';
        }

        tr.innerHTML = 
          '<td class="px-4 py-3 font-bold text-center text-indigo-700">' + posicaoTexto + '</td>' +
          '<td class="px-4 py-3">' +
            '<p class="font-bold text-slate-800">' + escapeHTML(reg.nome_aluno) + '</p>' +
            '<p class="text-[11px] text-slate-500 mt-0.5"><i class="fa-solid fa-phone text-[10px] text-slate-400 mr-1"></i>' + textoContatos + '</p>' +
          '</td>' +
          '<td class="px-4 py-3">' +
            '<div class="flex items-center">' + nucleoTag + '<span class="font-bold text-slate-700">' + (escapeHTML(reg.curso) || '-') + '</span></div>' +
            '<p class="text-[11px] text-slate-400">' + (escapeHTML(reg.periodo) || '-') + '</p>' +
          '</td>' +
          '<td class="px-4 py-3 text-[11px] text-slate-500">' + dataFormatada + '</td>' +
          '<td class="px-4 py-3"><span class="px-2 py-0.5 rounded-md text-[10px] font-bold border ' + statusClass + '">' + escapeHTML(reg.status) + '</span></td>' +
          '<td class="px-4 py-3 text-right">' +
            '<div class="inline-flex items-center gap-1.5">' +
              btnConvocar +
              '<select onchange="atualizarStatus(' + reg.id + ', this.value)" class="text-[11px] px-2 py-1 bg-slate-100 border border-slate-200 rounded-lg cursor-pointer">' +
                '<option value="Aguardando" ' + (reg.status === 'Aguardando' ? 'selected' : '') + '>Aguardando</option>' +
                '<option value="Convocado" ' + (reg.status === 'Convocado' ? 'selected' : '') + '>Convocado</option>' +
                '<option value="Matriculado" ' + (reg.status === 'Matriculado' ? 'selected' : '') + '>Matriculado</option>' +
                '<option value="Desistente" ' + (reg.status === 'Desistente' ? 'selected' : '') + '>Desistente</option>' +
              '</select>' +
              '<button onclick="excluirCandidato(' + reg.id + ', \'' + encodeURIComponent(reg.nome_aluno || '') + '\')" class="px-2 py-1 bg-white border border-slate-200 text-slate-400 hover:text-rose-600 rounded-lg transition cursor-pointer"><i class="fa-solid fa-trash-can text-[11px]"></i></button>' +
            '</div>' +
          '</td>';
        corpo.appendChild(tr);
      });
    }

    async function atualizarStatus(id, novoStatus) {
      try {
        await db.from('fila_cemart').update({ status: novoStatus }).eq('id', id);
        const item = registrosGlobais.find(r => r.id === id);
        if (item) item.status = novoStatus;
        atualizarCards(registrosGlobais);
        filtrarTabela();
      } catch (err) { alert('Erro ao atualizar.'); carregarDadosFila(); }
    }

    async function convocarWhatsApp(id, nomeCod, tel, cursoCod, perCod, protCod) {
      const nome = decodeURIComponent(nomeCod);
      if (!confirm('Confirmar convocação de ' + nome + '?')) return;
      try {
        await atualizarStatus(id, 'Convocado');
        const msg = '*CEMART - CONVOCAÇÃO DE VAGA*\n\nOlá, *' + nome + '*!\nSurgiu vaga em *' + decodeURIComponent(cursoCod) + '*!\nCompareça à secretaria em até *2 dias úteis*.';
        window.open('https://api.whatsapp.com/send?phone=55' + tel + '&text=' + encodeURIComponent(msg), '_blank');
      } catch (err) { alert('Erro na convocação.'); }
    }

    async function excluirCandidato(id, nomeCod) {
      if (!confirm('EXCLUIR permanentemente ' + decodeURIComponent(nomeCod) + '?')) return;
      try {
        await db.from('fila_cemart').delete().eq('id', id);
        registrosGlobais = registrosGlobais.filter(r => r.id !== id);
        atualizarCards(registrosGlobais);
        filtrarTabela();
      } catch (err) { alert('Erro ao excluir.'); }
    }

    function atualizarCards(lista) {
      document.getElementById('totalRegistros').innerText = lista.length;
      document.getElementById('totalAguardando').innerText = lista.filter(r => r.status === 'Aguardando').length;
      document.getElementById('totalConvocados').innerText = lista.filter(r => r.status === 'Convocado').length;
      document.getElementById('totalMatriculados').innerText = lista.filter(r => r.status === 'Matriculado').length;
    }

    function filtrarTabela() {
      const texto = document.getElementById('buscaTexto').value.toLowerCase();
      const nucleo = document.getElementById('filtroNucleo').value;
      const curso = document.getElementById('filtroCurso').value;
      const status = document.getElementById('filtroStatus').value;
      const filtrados = registrosGlobais.filter(r => {
        const nome = (r.nome_aluno || '').toLowerCase();
        const prot = (r.protocolo || '').toLowerCase();
        const bateTexto = nome.includes(texto) || prot.includes(texto);
        let bateNucleo = true;
        if (nucleo) {
          const cInfo = cursosBanco.find(c => c.nome_curso === r.curso);
          bateNucleo = cInfo && cInfo.nucleo === nucleo;
        }
        const bateCurso = curso === '' || r.curso === curso;
        const bateStatus = status === '' || r.status === status;
        return bateTexto && bateNucleo && bateCurso && bateStatus;
      });
      renderizarTabela(filtrados);
    }

    /* --- CURSOS MODAL --- */
    async function abrirModalCursos() {
      document.getElementById('modalCursos').classList.remove('hidden');
      document.getElementById('modalCursos').classList.add('flex');
      await listarCursosModal();
    }
    function fecharModalCursos() {
      document.getElementById('modalCursos').classList.add('hidden');
      document.getElementById('modalCursos').classList.remove('flex');
      carregarCursosFiltro();
    }

    async function listarCursosModal() {
      const listaEl = document.getElementById('listaCursosModal');
      const scrollPos = listaEl.scrollTop;
      listaEl.innerHTML = '<p class="text-center py-4 text-xs text-slate-400">Carregando...</p>';
      try {
        const { data: cursos } = await db.from('cursos').select('*').order('nome_curso');
        const grupos = {};
        (cursos || []).forEach(c => { const n = c.nucleo || 'Outros'; if (!grupos[n]) grupos[n] = []; grupos[n].push(c); });
        
        listaEl.innerHTML = '';
        for (const [nucleo, lista] of Object.entries(grupos)) {
          const container = document.createElement('div');
          container.className = 'pt-2';
          container.innerHTML = '<div class="bg-indigo-50/80 px-3 py-1.5 rounded-xl font-bold text-xs text-indigo-900 mb-2">Núcleo de ' + escapeHTML(nucleo) + '</div>';
          const divFilhos = document.createElement('div');
          divFilhos.className = 'divide-y divide-slate-100 pl-1';
          
          lista.forEach(c => {
            const row = document.createElement('div');
            row.className = 'py-3 flex flex-col md:flex-row md:items-center justify-between gap-3';
            row.innerHTML = 
              '<div class="flex items-center gap-2 min-w-[180px]">' +
                '<span class="w-2.5 h-2.5 rounded-full ' + (c.ativo ? 'bg-emerald-500' : 'bg-slate-300') + '"></span>' +
                '<div>' +
                  '<span class="text-xs font-semibold ' + (c.ativo ? 'text-slate-800' : 'text-slate-400 line-through') + '">' + escapeHTML(c.nome_curso) + '</span>' +
                  '<p class="text-[10px] text-slate-400">' + (escapeHTML(c.area) || 'Geral') + '</p>' +
                '</div>' +
              '</div>' +
              '<div class="flex flex-wrap items-center gap-2">' +
                '<div class="flex items-center gap-1.5 text-[11px] bg-slate-50 px-2 py-1 rounded-xl border border-slate-200">' +
                  '<span class="text-slate-500">Idade:</span>' +
                  '<input type="number" min="0" value="' + (c.idade_minima || 0) + '" onchange="atualizarCampoCurso(' + c.id_curso + ', \'idade_minima\', this.value)" class="w-9 px-1 py-0.5 bg-white border border-slate-300 rounded text-center text-xs font-bold text-slate-700">' +
                  '<span class="text-slate-400">a</span>' +
                  '<input type="number" min="0" value="' + (c.idade_maxima || '') + '" onchange="atualizarCampoCurso(' + c.id_curso + ', \'idade_maxima\', this.value)" class="w-9 px-1 py-0.5 bg-white border border-slate-300 rounded text-center text-xs font-bold text-slate-700">' +
                '</div>' +
                '<div class="flex items-center gap-1.5 text-[11px] bg-amber-50 px-2 py-1 rounded-xl border border-amber-200">' +
                  '<span class="text-amber-700">Limite Fila:</span>' +
                  '<input type="number" min="0" value="' + (c.limite_fila || 0) + '" onchange="atualizarCampoCurso(' + c.id_curso + ', \'limite_fila\', this.value)" class="w-12 px-1 py-0.5 bg-white border border-amber-300 rounded text-center text-xs font-bold text-amber-900">' +
                '</div>' +
              '</div>' +
              '<div class="flex items-center gap-1.5 flex-wrap">' +
                '<button onclick="alternarTurnoCurso(' + c.id_curso + ', \'manha\', ' + (c.manha !== false) + ')" class="px-2 py-0.5 rounded text-[10px] font-bold border transition ' + (c.manha !== false && c.ativo ? 'bg-indigo-100 text-indigo-800 border-indigo-300' : 'bg-slate-100 text-slate-400 border-slate-200') + '">Manhã</button>' +
                '<button onclick="alternarTurnoCurso(' + c.id_curso + ', \'tarde\', ' + (c.tarde !== false) + ')" class="px-2 py-0.5 rounded text-[10px] font-bold border transition ' + (c.tarde !== false && c.ativo ? 'bg-indigo-100 text-indigo-800 border-indigo-300' : 'bg-slate-100 text-slate-400 border-slate-200') + '">Tarde</button>' +
                '<button onclick="alternarTurnoCurso(' + c.id_curso + ', \'noite\', ' + (c.noite !== false) + ')" class="px-2 py-0.5 rounded text-[10px] font-bold border transition ' + (c.noite !== false && c.ativo ? 'bg-indigo-100 text-indigo-800 border-indigo-300' : 'bg-slate-100 text-slate-400 border-slate-200') + '">Noite</button>' +
                '<button onclick="alternarStatusCurso(' + c.id_curso + ', ' + c.ativo + ')" class="ml-1 px-2 py-0.5 rounded text-[10px] font-semibold border transition ' + (c.ativo ? 'bg-rose-50 text-rose-600 border-rose-200' : 'bg-emerald-50 text-emerald-600 border-emerald-200') + '">' + (c.ativo ? 'Inativar' : 'Ativar') + '</button>' +
              '</div>';
            divFilhos.appendChild(row);
          });
          container.appendChild(divFilhos);
          listaEl.appendChild(container);
        }
        setTimeout(() => { listaEl.scrollTop = scrollPos; }, 10);
      } catch (e) { listaEl.innerHTML = '<p class="text-center py-4 text-xs text-rose-500">Erro.</p>'; }
    }

    async function atualizarCampoCurso(idCurso, campo, valor) {
      try {
        const updateData = {}; updateData[campo] = valor === '' ? null : parseInt(valor, 10);
        await db.from('cursos').update(updateData).eq('id_curso', idCurso);
      } catch (e) { alert('Erro ao atualizar campo.'); }
    }
    async function alternarTurnoCurso(idCurso, turno, valorAtual) {
      try { const updateData = {}; updateData[turno] = !valorAtual; await db.from('cursos').update(updateData).eq('id_curso', idCurso); await listarCursosModal(); } catch (e) {}
    }
    async function alternarStatusCurso(idCurso, statusAtual) {
      try { await db.from('cursos').update({ ativo: !statusAtual }).eq('id_curso', idCurso); await listarCursosModal(); } catch (e) {}
    }
    async function adicionarCurso(e) {
      e.preventDefault();
      const nome = document.getElementById('novoCursoInput').value.trim();
      if (!nome) return;
      document.getElementById('btnAdicionarCurso').disabled = true;
      try {
        await db.from('cursos').insert([{ 
          nome_curso: nome, 
          nucleo: document.getElementById('novoCursoNucleo').value, 
          area: document.getElementById('novoCursoArea').value.trim() || 'Geral',
          idade_minima: document.getElementById('novoCursoIdadeMin').value ? parseInt(document.getElementById('novoCursoIdadeMin').value) : 0,
          idade_maxima: document.getElementById('novoCursoIdadeMax').value ? parseInt(document.getElementById('novoCursoIdadeMax').value) : null,
          limite_fila: document.getElementById('novoCursoLimite').value ? parseInt(document.getElementById('novoCursoLimite').value) : 0,
          ativo: true, manha: true, tarde: true, noite: true 
        }]);
        e.target.reset(); await listarCursosModal();
      } catch (err) { alert('Erro ao cadastrar curso.'); } 
      finally { document.getElementById('btnAdicionarCurso').disabled = false; }
    }

    /* --- UTILIDADES, SENHA E LOGOUT --- */
    let qrcodeInstancia = null;
    function abrirModalQRCode() { document.getElementById('modalQRCode').classList.remove('hidden'); document.getElementById('modalQRCode').classList.add('flex'); if (!qrcodeInstancia) { qrcodeInstancia = new QRCode(document.getElementById('areaQRCode'), { text: window.location.origin + window.location.pathname.replace('painel-gestao.html', 'inscricao.html'), width: 180, height: 180, colorDark: "#1e1b4b", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H }); } }
    function fecharModalQRCode() { document.getElementById('modalQRCode').classList.add('hidden'); document.getElementById('modalQRCode').classList.remove('flex'); }
    
    function exportarCSV() { 
      if (registrosGlobais.length === 0) return alert('Sem registros.'); 
      let csv = '\uFEFFProtocolo;Aluno;Telefone 1;Telefone 2;Curso;Período;Status;Data Inscrição\n'; 
      registrosGlobais.forEach(r => { 
        csv += '"' + escapeHTML(r.protocolo) + '";"' + escapeHTML(r.nome_aluno) + '";"' + formatarTelefoneExibicao(r.fone1) + '";"' + formatarTelefoneExibicao(r.fone2) + '";"' + escapeHTML(r.curso) + '";"' + escapeHTML(r.periodo) + '";"' + escapeHTML(r.status) + '";"' + (r.criado_em ? new Date(r.criado_em).toLocaleDateString('pt-BR') : '') + '"\n'; 
      }); 
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' }); 
      const link = document.createElement('a'); 
      link.href = URL.createObjectURL(blob); 
      link.download = 'fila_cemart_' + new Date().toISOString().slice(0, 10) + '.csv'; 
      link.click(); 
    }
    
    function abrirModalSenha() { document.getElementById('modalSenha').classList.remove('hidden'); document.getElementById('modalSenha').classList.add('flex'); }
    function fecharModalSenha() { document.getElementById('modalSenha').classList.add('hidden'); document.getElementById('modalSenha').classList.remove('flex'); }
    
    async function processarTrocaSenha(e) { 
      e.preventDefault(); 
      const btn = document.getElementById('btnSalvarSenha'); 
      btn.disabled = true; 
      btn.innerText = 'A salvar...';

      const senhaAtual = document.getElementById('senhaAtualInput').value;
      const novaSenha = document.getElementById('senhaNovaInput').value;

      try {
        const userData = await db.auth.getUser();
        let userEmail = null;
        if (userData && userData.data && userData.data.user) {
          userEmail = userData.data.user.email;
        }

        if(userEmail) {
           const { error: signInError } = await db.auth.signInWithPassword({ email: userEmail, password: senhaAtual });
           if (signInError) throw new Error('A palavra-passe atual está incorreta.');
        }

        const { error } = await db.auth.updateUser({ password: novaSenha });
        if (error) throw error;
        
        alert('Sua palavra-passe foi atualizada com sucesso!');
        fecharModalSenha();
      } catch (err) {
        alert(err.message || 'Erro ao atualizar a palavra-passe.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Salvar';
      }
    }

    async function fazerLogout() { 
      sessionStorage.removeItem('autenticado_cemart');
      await db.auth.signOut(); 
      window.location.href = 'index.html'; 
    }
  </script>
