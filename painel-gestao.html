<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEMART - Painel de Gestão</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Dependências do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Topbar -->
  <header class="bg-slate-900 text-white px-6 py-3.5 flex items-center justify-between border-b border-slate-800">
    <div class="flex items-center gap-3">
      <span class="bg-indigo-600 px-2 py-1 rounded text-xs font-bold text-amber-400">CEMART</span>
      <h1 class="text-sm font-bold">Gestão da Fila de Espera • Secretaria</h1>
    </div>
    
    <!-- Ações agrupadas à direita -->
    <div class="flex items-center gap-2">
      <button onclick="renderizarTabela()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg flex items-center gap-1.5 transition" title="Atualizar Dados">
        <i class="fa-solid fa-arrows-rotate"></i> Atualizar
      </button>
      <button onclick="abrirModalCursos()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg flex items-center gap-1.5 transition">
        <i class="fa-solid fa-list-check"></i> Gerenciar Cursos
      </button>
      <a href="inscricao.html" target="_blank" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg flex items-center gap-1.5 transition">
        <i class="fa-solid fa-plus"></i> Digitar Nova Ficha
      </a>
    </div>
  </header>

  <main class="p-6 flex-1 max-w-7xl mx-auto w-full space-y-5">
    
    <!-- Filtros de Tabela -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex flex-wrap gap-3 items-center justify-between">
      <div class="flex flex-wrap gap-2 text-xs">
        
        <!-- Filtro Dinâmico por Curso -->
        <select id="filtroCurso" onchange="renderizarTabela()" class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 font-medium">
          <option value="">Todos os Cursos</option>
        </select>

        <!-- Filtro por Período -->
        <select id="filtroPeriodo" onchange="renderizarTabela()" class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 font-medium">
          <option value="">Todos os Períodos</option>
          <option value="Matutino">Matutino</option>
          <option value="Vespertino">Vespertino</option>
          <option value="Noturno">Noturno</option>
        </select>

        <!-- Filtro por Nível -->
        <select id="filtroNivel" onchange="renderizarTabela()" class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 font-medium">
          <option value="">Todos os Níveis</option>
          <option value="Iniciante">Iniciante</option>
          <option value="Intermediário">Intermediário</option>
          <option value="Avançado">Avançado</option>
        </select>
      </div>

      <div class="text-xs text-slate-500 font-medium">
        Total filtrado: <span id="contadorTotal" class="font-bold text-slate-800">0</span>
      </div>
    </div>

    <!-- Tabela da Fila -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-50 text-slate-500 uppercase text-[10px] tracking-wider border-b border-slate-200">
            <tr>
              <th class="py-3 px-4 text-center w-12">Pos.</th>
              <th class="py-3 px-4">Protocolo / Data</th>
              <th class="py-3 px-4">Aluno / Responsável</th>
              <th class="py-3 px-4">WhatsApp</th>
              <th class="py-3 px-4">Curso / Turno / Nível</th>
              <th class="py-3 px-4">Status</th>
              <th class="py-3 px-4 text-right">Ação Rápida</th>
            </tr>
          </thead>
          <tbody id="corpoTabela" class="divide-y divide-slate-100 text-slate-700">
            <tr>
              <td colspan="7" class="py-6 text-center text-slate-400">
                <i class="fa-solid fa-spinner fa-spin mr-1"></i> Carregando dados do banco...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Modal de Gestão de Cursos -->
  <div id="modalCursos" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200 space-y-4">
      
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="text-sm font-bold text-slate-800">Grade de Oficinas e Cursos</h3>
        <button onclick="fecharModalCursos()" class="text-slate-400 hover:text-slate-600 text-base">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Cadastro de Novo Curso -->
      <div class="flex gap-2">
        <input type="text" id="novoNomeCurso" placeholder="Nome da nova oficina..." class="flex-1 px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none">
        <button onclick="adicionarCurso()" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-xs transition flex items-center gap-1">
          <i class="fa-solid fa-plus"></i> Adicionar
        </button>
      </div>

      <!-- Lista com Botões de Ativar/Desativar -->
      <div class="max-h-60 overflow-y-auto border border-slate-100 rounded-xl divide-y divide-slate-100" id="listaCursosModal">
        <!-- Preenchido via JavaScript -->
      </div>

      <div class="text-right pt-2">
        <button onclick="fecharModalCursos()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg text-xs">
          Fechar
        </button>
      </div>

    </div>
  </div>

  <script>
    // --- Funções do Modal de Gestão de Cursos ---
    function abrirModalCursos() {
      const modal = document.getElementById('modalCursos');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      renderizarListaCursosModal();
    }

    function fecharModalCursos() {
      const modal = document.getElementById('modalCursos');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    async function renderizarListaCursosModal() {
      const container = document.getElementById('listaCursosModal');
      container.innerHTML = '<p class="p-3 text-center text-xs text-slate-400">Carregando oficinas...</p>';

      const { data: lista, error } = await db
        .from('cursos')
        .select('id_curso, nome_curso, ativo')
        .order('nome_curso', { ascending: true });

      if (error) {
        container.innerHTML = '<p class="p-3 text-center text-xs text-red-500">Erro ao carregar cursos.</p>';
        return;
      }

      container.innerHTML = '';
      lista.forEach(c => {
        const item = document.createElement('div');
        item.className = 'p-2.5 flex items-center justify-between text-xs hover:bg-slate-50';
        
        item.innerHTML = `
          <span class="font-medium ${c.ativo ? 'text-slate-800' : 'text-slate-400 line-through'}">${c.nome_curso}</span>
          <button onclick="alternarStatusCurso(${c.id_curso}, ${!c.ativo})" class="px-2.5 py-1 rounded-md text-[10px] font-bold transition ${c.ativo ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100' : 'bg-slate-100 text-slate-500 border border-slate-200 hover:bg-slate-200'}">
            ${c.ativo ? '<i class="fa-solid fa-check mr-1"></i> Ativo' : '<i class="fa-solid fa-ban mr-1"></i> Inativo'}
          </button>
        `;
        container.appendChild(item);
      });
    }

    async function alternarStatusCurso(idCurso, novoStatus) {
      const { error } = await db
        .from('cursos')
        .update({ ativo: novoStatus })
        .eq('id_curso', idCurso);

      if (!error) {
        renderizarListaCursosModal();
        carregarFiltroCursos();
      } else {
        alert('Erro ao atualizar status do curso: ' + error.message);
      }
    }

    async function adicionarCurso() {
      const input = document.getElementById('novoNomeCurso');
      const nome = input.value.trim();

      if (!nome) return;

      const { error } = await db
        .from('cursos')
        .insert([{ nome_curso: nome, ativo: true }]);

      if (error) {
        alert('Erro ao cadastrar curso: ' + error.message);
      } else {
        input.value = '';
        renderizarListaCursosModal();
        carregarFiltroCursos();
      }
    }

    // --- Funções da Tabela de Gestão da Fila ---
    async function carregarFiltroCursos() {
      const selectFiltro = document.getElementById('filtroCurso');
      try {
        const { data: listaCursos, error } = await db
          .from('cursos')
          .select('nome_curso')
          .order('nome_curso', { ascending: true });

        if (!error && listaCursos) {
          selectFiltro.innerHTML = '<option value="">Todos os Cursos</option>';
          listaCursos.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.nome_curso;
            opt.textContent = c.nome_curso;
            selectFiltro.appendChild(opt);
          });
        }
      } catch (err) {
        console.error('Erro ao carregar lista de filtros de curso:', err);
      }
    }

    async function renderizarTabela() {
      const curso = document.getElementById('filtroCurso').value;
      const periodo = document.getElementById('filtroPeriodo').value;
      const nivel = document.getElementById('filtroNivel').value;
      const tbody = document.getElementById('corpoTabela');

      tbody.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Atualizando...</td></tr>';

      try {
        let query = db.from('fila_cemart').select('*').order('criado_em', { ascending: true });

        if (curso !== '') query = query.eq('curso', curso);
        if (periodo !== '') query = query.eq('periodo', periodo);
        if (nivel !== '') query = query.eq('nivel', nivel);

        const { data: lista, error } = await query;
        if (error) throw error;

        tbody.innerHTML = '';
        document.getElementById('contadorTotal').innerText = lista ? lista.length : 0;

        if (!lista || lista.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-slate-400">Nenhum registro encontrado para os filtros selecionados.</td></tr>';
          return;
        }

        let posicaoFila = 1;

        lista.forEach((item) => {
          const tr = document.createElement('tr');
          tr.className = 'hover:bg-slate-50 transition';

          const msgWhats = encodeURIComponent(`Olá ${item.nome_responsavel || item.nome_aluno}, informamos que surgiu uma vaga para o curso de ${item.curso} (${item.periodo}) no CEMART. Favor comparecer para efetivar a matrícula.`);
          const foneLimpo = item.fone1 ? item.fone1.replace(/\D/g, '') : '';
          const posTexto = item.status === 'Aguardando' ? `${posicaoFila++}º` : '—';

          tr.innerHTML = `
            <td class="py-3 px-4 text-center font-bold ${item.status === 'Aguardando' ? 'text-indigo-700 text-sm' : 'text-slate-400'}">${posTexto}</td>
            <td class="py-3 px-4">
              <span class="font-bold text-slate-800">${item.protocolo}</span>
              <span class="block text-[10px] text-slate-400">${new Date(item.criado_em).toLocaleDateString('pt-BR')}</span>
            </td>
            <td class="py-3 px-4">
              <p class="font-semibold text-slate-800">${item.nome_aluno}</p>
              ${item.nome_responsavel ? `<p class="text-[11px] text-slate-400">Resp: ${item.nome_responsavel}</p>` : ''}
            </td>
            <td class="py-3 px-4">
              <div class="flex items-center gap-1.5 text-slate-600">
                <span>${item.fone1}</span>
                <a href="https://wa.me/55${foneLimpo}?text=${msgWhats}" target="_blank" class="text-emerald-600 hover:text-emerald-700" title="Chamar no WhatsApp">
                  <i class="fa-brands fa-whatsapp text-sm"></i>
                </a>
              </div>
              ${item.fone2 ? `<span class="block text-[10px] text-slate-400">F2: ${item.fone2}</span>` : ''}
            </td>
            <td class="py-3 px-4">
              <span class="font-medium text-slate-800">${item.curso}</span>
              <span class="block text-[10px] text-slate-500">${item.periodo} • <strong class="text-indigo-600">${item.nivel || 'Iniciante'}</strong></span>
            </td>
            <td class="py-3 px-4">
              <select onchange="atualizarStatus('${item.protocolo}', this.value)" class="text-[11px] font-semibold rounded-lg px-2 py-1 border border-slate-200 ${item.status === 'Convocado' ? 'bg-indigo-50 text-indigo-700' : item.status === 'Matriculado' ? 'bg-emerald-50 text-emerald-700' : item.status === 'Desistente / Cancelado' ? 'bg-rose-50 text-rose-700' : 'bg-amber-50 text-amber-700'}">
                <option value="Aguardando" ${item.status === 'Aguardando' ? 'selected' : ''}>Aguardando</option>
                <option value="Convocado" ${item.status === 'Convocado' ? 'selected' : ''}>Convocado</option>
                <option value="Matriculado" ${item.status === 'Matriculado' ? 'selected' : ''}>Matriculado</option>
                <option value="Desistente / Cancelado" ${item.status === 'Desistente / Cancelado' ? 'selected' : ''}>Desistente</option>
              </select>
            </td>
            <td class="py-3 px-4 text-right">
              <a href="https://wa.me/55${foneLimpo}?text=${msgWhats}" target="_blank" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-[11px] font-semibold inline-flex items-center gap-1 transition">
                <i class="fa-solid fa-bullhorn text-[10px]"></i> Notificar
              </a>
            </td>
          `;
          tbody.appendChild(tr);
        });

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="py-6 text-center text-red-500">Erro ao carregar dados: ${err.message || 'Verifique sua conexão.'}</td></tr>`;
      }
    }

    async function atualizarStatus(protocolo, novoStatus) {
      const { error } = await db
        .from('fila_cemart')
        .update({ status: novoStatus })
        .eq('protocolo', protocolo);

      if (error) {
        alert('Erro ao atualizar status: ' + error.message);
      } else {
        renderizarTabela();
      }
    }

    // Inicialização ao carregar a página
    document.addEventListener('DOMContentLoaded', async () => {
      await carregarFiltroCursos();
      renderizarTabela();
    });
  </script>
</body>
</html>
